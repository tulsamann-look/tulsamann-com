<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .canvas { fill: oklch(98.5% 0.008 70); }
      .ink { fill: oklch(20% 0.015 60); }
      .clay { fill: oklch(63% 0.16 38); }
      .mute { fill: oklch(46% 0.012 60); }
      .display { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 600; letter-spacing: -0.02em; }
      .body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 400; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 500; letter-spacing: 0.08em; }
    </style>
  </defs>
  <rect class="canvas" width="1200" height="630"/>

  <!-- Eyebrow -->
  <text class="mono mute" x="80" y="120" font-size="18">LEAD GENERATION + AI IMPLEMENTATION FOR B2B</text>

  <!-- Display headline -->
  <text class="display ink" x="80" y="220" font-size="68">Tulsa Mann</text>

  <text class="display ink" x="80" y="320" font-size="44">I help B2B founders cut their</text>
  <text class="display ink" x="80" y="380" font-size="44">cost-per-lead in half — and build</text>
  <text class="display ink" x="80" y="440" font-size="44">with <tspan class="clay" text-decoration="underline">Claude</tspan> while doing it.</text>

  <!-- Footer line -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="oklch(90% 0.01 70)" stroke-width="1"/>

  <text class="body mute" x="80" y="580" font-size="20">Look Consulting · tulsamann.com</text>
</svg>
